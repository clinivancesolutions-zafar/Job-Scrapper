<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syronza — Job Scraper Prototype</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#111827;background:#f6f7fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:28px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-size:26px;font-weight:800}.pill{font-size:12px;background:#e8f7ee;color:#16713b;padding:7px 10px;border-radius:999px}
.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 4px 18px #00000008;margin-bottom:18px}
.controls{display:grid;grid-template-columns:1fr 1fr 150px 130px;gap:10px}
input,select,button{height:44px;border:1px solid #d1d5db;border-radius:10px;padding:0 12px;font:inherit}
button{background:#111827;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:12px 16px;background:#f9fafb;border-radius:12px;min-width:150px}.num{font-size:22px;font-weight:800}.muted{color:#6b7280;font-size:13px}
.job{padding:16px 0;border-top:1px solid #eee;display:grid;grid-template-columns:1fr auto;gap:10px}.job:first-child{border-top:0}
.title{font-size:17px;font-weight:750}.company{color:#4b5563;margin-top:4px}.meta{color:#6b7280;font-size:13px;margin-top:7px}
a{color:#2563eb;text-decoration:none}.tag{display:inline-block;padding:4px 7px;border-radius:7px;background:#f1f5f9;margin-right:5px;font-size:11px}
.status{margin-top:10px;font-size:13px}.error{color:#b91c1c}.ok{color:#166534}
@media(max-width:800px){.controls{grid-template-columns:1fr}.job{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">syronza</div><div class="pill">LIVE SCRAPER PROTOTYPE</div></header>

<div class="card">
  <h2 style="margin-top:0">Job discovery</h2>
  <p class="muted">Search live Greenhouse and Lever job boards. No database or local installation is required for this prototype.</p>
  <div class="controls">
    <input id="query" placeholder="Keyword — e.g. software engineer">
    <input id="location" placeholder="Location — e.g. remote, Mumbai">
    <select id="source"><option value="all">All sources</option><option value="greenhouse">Greenhouse</option><option value="lever">Lever</option></select>
    <button id="run">Scrape jobs</button>
  </div>
  <div id="status" class="status muted">Ready.</div>
</div>

<div class="stats">
  <div class="stat"><div class="num" id="count">0</div><div class="muted">Jobs found</div></div>
  <div class="stat"><div class="num" id="companies">0</div><div class="muted">Companies</div></div>
  <div class="stat"><div class="num" id="sources">0</div><div class="muted">Live sources</div></div>
</div>

<div class="card" style="margin-top:18px">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h3 style="margin:0">Results</h3>
    <button id="csv" style="background:#374151" disabled>Export CSV</button>
  </div>
  <div id="results" style="margin-top:8px"><p class="muted">Run a scrape to see jobs.</p></div>
</div>
</div>

<script>
let lastJobs=[];
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(jobs){
  lastJobs=jobs;$('count').textContent=jobs.length;
  $('companies').textContent=new Set(jobs.map(x=>x.company)).size;
  $('sources').textContent=new Set(jobs.map(x=>x.source)).size;
  $('csv').disabled=!jobs.length;
  if(!jobs.length){$('results').innerHTML='<p class="muted">No matching jobs found.</p>';return}
  $('results').innerHTML=jobs.map(j=>`
    <div class="job">
      <div>
        <div class="title">${esc(j.title)}</div>
        <div class="company">${esc(j.company)}</div>
        <div class="meta">${esc(j.location||'Location not specified')} · <span class="tag">${esc(j.source)}</span>${j.department?`<span class="tag">${esc(j.department)}</span>`:''}</div>
      </div>
      <div><a href="${esc(j.url)}" target="_blank" rel="noopener">View job →</a></div>
    </div>`).join('');
}
$('run').onclick=async()=>{
  const b=$('run');b.disabled=true;$('status').textContent='Scraping live job boards…';$('status').className='status muted';
  try{
    const p=new URLSearchParams({q:$('query').value,location:$('location').value,source:$('source').value});
    const r=await fetch('/api/jobs?'+p);
    const contentType=r.headers.get('content-type')||'';
    const raw=await r.text();
    let data;
    try { data=JSON.parse(raw); }
    catch { throw new Error(`API did not return JSON (${r.status}). ${raw.slice(0,120)}`); }
    if(!r.ok) throw new Error(data.error||'Scrape failed');
    render(data.jobs||[]);
    $('status').textContent=`Done — checked ${data.boardsChecked} boards and found ${data.jobsFound} jobs.`;
    $('status').className='status ok';
  }catch(e){$('status').textContent=e.message;$('status').className='status error'}
  finally{b.disabled=false}
};
$('csv').onclick=()=>{
  const cols=['title','company','location','department','source','url'];
  const csv=[cols.join(','),...lastJobs.map(j=>cols.map(c=>`"${String(j[c]??'').replaceAll('"','""')}"`).join(','))].join('\\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='syronza-jobs.csv';a.click();
};
</script>
</body>
</html>
